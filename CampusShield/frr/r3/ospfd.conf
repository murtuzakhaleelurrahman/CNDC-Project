hostname r3-ospfd
password campusshield
enable password campusshield
log stdout
!
interface r3-eth0
 ip ospf network point-to-point
 ip ospf cost 15
!
interface r3-eth1
 ip ospf network point-to-point
 ip ospf cost 15
!
router ospf
 ospf router-id 3.3.3.3
 passive-interface r3-eth2
 passive-interface r3-eth3
 network 10.10.40.0/22 area 0.0.0.0
 network 10.10.50.0/25 area 0.0.0.0
 network 10.10.255.4/30 area 0.0.0.0
 network 10.10.255.8/30 area 0.0.0.0
!
