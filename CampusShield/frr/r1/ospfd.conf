hostname r1-ospfd
password campusshield
enable password campusshield
log stdout
!
interface r1-eth0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r1-eth1
 ip ospf network point-to-point
 ip ospf cost 15
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface r1-eth2
 network 10.10.10.0/26 area 0.0.0.0
 network 10.10.255.0/30 area 0.0.0.0
 network 10.10.255.4/30 area 0.0.0.0
!
