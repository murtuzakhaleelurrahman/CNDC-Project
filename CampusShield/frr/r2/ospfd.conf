hostname r2-ospfd
password campusshield
enable password campusshield
log stdout
!
interface r2-eth0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r2-eth1
 ip ospf network point-to-point
 ip ospf cost 15
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface r2-eth2
 passive-interface r2-eth3
 network 10.10.20.0/24 area 0.0.0.0
 network 10.10.30.0/23 area 0.0.0.0
 network 10.10.255.0/30 area 0.0.0.0
 network 10.10.255.8/30 area 0.0.0.0
!
